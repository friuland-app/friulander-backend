steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/friulander-backend:$COMMIT_SHA', '.' ]
  
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/friulander-backend:$COMMIT_SHA' ]
  
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'friulander-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/friulander-backend:$COMMIT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'
      - '--max-instances'
      - '100'
      - '--min-instances'
      - '1'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'

timeout: '600s'
