<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Water tile for Tagliamento River -->
  <defs>
    <pattern id="waterPattern" x="0" y="0" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect width="32" height="16" fill="#4FC3F7"/>
      <path d="M 0 8 Q 8 4 16 8 T 32 8" stroke="#29B6F6" stroke-width="1.5" fill="none" opacity="0.5"/>
      <path d="M 0 12 Q 8 8 16 12 T 32 12" stroke="#039BE5" stroke-width="1" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="64" height="64" fill="url(#waterPattern)"/>
  
  <!-- Sparkles -->
  <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="35" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="50" r="1.2" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
