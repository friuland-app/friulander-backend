<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Furlanet - Tipo Fuoco/Folklore -->
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <radialGradient id="flameGrad" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </radialGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="64" cy="75" rx="35" ry="40" fill="url(#bodyGrad)"/>
  
  <!-- Head -->
  <circle cx="64" cy="40" r="28" fill="url(#bodyGrad)"/>
  
  <!-- Eyes -->
  <ellipse cx="54" cy="38" rx="6" ry="8" fill="#2D5A27"/>
  <ellipse cx="74" cy="38" rx="6" ry="8" fill="#2D5A27"/>
  <circle cx="56" cy="36" r="2" fill="white"/>
  <circle cx="76" cy="36" r="2" fill="white"/>
  
  <!-- Mouth -->
  <path d="M 54 50 Q 64 58 74 50" stroke="#2D5A27" stroke-width="2" fill="none"/>
  
  <!-- Flame on head (Furlan spirit) -->
  <path d="M 50 15 Q 64 -5 78 15 Q 70 8 64 12 Q 58 8 50 15" fill="url(#flameGrad)"/>
  <path d="M 56 20 Q 64 5 72 20" fill="#FFD700" opacity="0.8"/>
  
  <!-- Traditional Furlan hat detail -->
  <path d="M 40 25 Q 64 15 88 25" stroke="#8B4513" stroke-width="3" fill="none"/>
  <circle cx="64" cy="18" r="4" fill="#D4A017"/>
  
  <!-- Arms -->
  <ellipse cx="30" cy="70" rx="12" ry="20" fill="url(#bodyGrad)" transform="rotate(-20 30 70)"/>
  <ellipse cx="98" cy="70" rx="12" ry="20" fill="url(#bodyGrad)" transform="rotate(20 98 70)"/>
  
  <!-- Feet -->
  <ellipse cx="50" cy="110" rx="12" ry="8" fill="#D4A017"/>
  <ellipse cx="78" cy="110" rx="12" ry="8" fill="#D4A017"/>
  
  <!-- Type indicator -->
  <circle cx="110" cy="110" r="12" fill="#FF6B35"/>
  <text x="110" y="115" font-size="12" text-anchor="middle" fill="white">🔥</text>
</svg>
