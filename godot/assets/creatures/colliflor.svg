<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Colliflor - Tipo Erba/Collio Vineyard -->
  <defs>
    <radialGradient id="vineBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4A2C8A"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#228B22"/>
    </linearGradient>
    <radialGradient id="grape" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>
  </defs>
  
  <!-- Body (round like grape cluster) -->
  <circle cx="64" cy="70" r="35" fill="url(#vineBody)"/>
  
  <!-- Grape cluster details -->
  <circle cx="55" cy="65" r="8" fill="url(#grape)"/>
  <circle cx="65" cy="58" r="8" fill="url(#grape)"/>
  <circle cx="75" cy="65" r="8" fill="url(#grape)"/>
  <circle cx="50" cy="75" r="7" fill="url(#grape)"/>
  <circle cx="64" cy="72" r="7" fill="url(#grape)"/>
  <circle cx="78" cy="75" r="7" fill="url(#grape)"/>
  <circle cx="58" cy="85" r="6" fill="url(#grape)"/>
  <circle cx="70" cy="85" r="6" fill="url(#grape)"/>
  
  <!-- Highlights on grapes -->
  <circle cx="53" cy="63" r="2" fill="white" opacity="0.4"/>
  <circle cx="63" cy="56" r="2" fill="white" opacity="0.4"/>
  <circle cx="73" cy="63" r="2" fill="white" opacity="0.4"/>
  
  <!-- Face -->
  <ellipse cx="58" cy="50" rx="4" ry="5" fill="#2D5A27"/>
  <ellipse cx="70" cy="50" rx="4" ry="5" fill="#2D5A27"/>
  <circle cx="59" cy="49" r="1" fill="white"/>
  <circle cx="71" cy="49" r="1" fill="white"/>
  
  <!-- Smile -->
  <path d="M 58 58 Q 64 63 70 58" stroke="#2D5A27" stroke-width="2" fill="none"/>
  
  <!-- Leaf on top -->
  <path d="M 64 25 Q 45 35 50 50 Q 64 40 78 50 Q 83 35 64 25" fill="url(#leaf)"/>
  <path d="M 64 25 Q 64 45 64 50" stroke="#1B5E20" stroke-width="1" fill="none"/>
  
  <!-- Vine tendrils -->
  <path d="M 35 60 Q 25 50 30 40" stroke="#2D5A27" stroke-width="2" fill="none"/>
  <path d="M 93 60 Q 103 50 98 40" stroke="#2D5A27" stroke-width="2" fill="none"/>
  
  <!-- Arms -->
  <path d="M 30 70 Q 20 60 25 50" stroke="url(#vineBody)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 98 70 Q 108 60 103 50" stroke="url(#vineBody)" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Type indicator -->
  <circle cx="110" cy="110" r="12" fill="#2D5A27"/>
  <text x="110" y="115" font-size="12" text-anchor="middle" fill="white">🌿</text>
</svg>
